name: Deploy Website to Cloudflare Workers

# The site is deployed by Cloudflare's Git integration (Workers Builds),
# which builds and deploys on every push to main. This workflow is kept
# for manual runs only; it needs CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# repo secrets to work.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: website
        run: |
          pnpm approve-builds esbuild sharp workerd
          pnpm install

      - name: Build website
        working-directory: website
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        working-directory: website
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
